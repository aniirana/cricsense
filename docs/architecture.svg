<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg">
<title>CricSense system architecture</title>
<desc>Three-tier architecture: Next.js frontend, Node.js/Express backend with MongoDB, and Python FastAPI AI service with MediaPipe.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="760" fill="#ffffff"/>

<!-- User -->
<g>
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#2C2C2A">Player / Coach</text>
</g>
<line x1="340" y1="64" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Frontend container -->
<g>
  <rect x="60" y="100" width="560" height="140" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="84" y="128" font-family="Arial" font-size="14" font-weight="700" fill="#26215C">Frontend</text>
  <text x="84" y="146" font-family="Arial" font-size="12" fill="#3C3489">Next.js · Tailwind CSS · Recharts</text>
</g>
<g>
  <rect x="84" y="160" width="155" height="56" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="161" y="184" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26215C">Pages</text>
  <text x="161" y="202" text-anchor="middle" font-family="Arial" font-size="12" fill="#3C3489">Login, dashboard, analyze</text>
</g>
<g>
  <rect x="262" y="160" width="155" height="56" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="339" y="184" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26215C">Components</text>
  <text x="339" y="202" text-anchor="middle" font-family="Arial" font-size="12" fill="#3C3489">Charts, benchmark report</text>
</g>
<g>
  <rect x="440" y="160" width="155" height="56" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="517" y="184" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26215C">Auth state</text>
  <text x="517" y="202" text-anchor="middle" font-family="Arial" font-size="12" fill="#3C3489">JWT in localStorage</text>
</g>

<line x1="340" y1="240" x2="340" y2="276" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="354" y="262" font-family="Arial" font-size="12" fill="#5F5E5A">REST + JWT</text>

<!-- Backend container -->
<g>
  <rect x="60" y="276" width="560" height="200" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="84" y="304" font-family="Arial" font-size="14" font-weight="700" fill="#04342C">Backend</text>
  <text x="84" y="322" font-family="Arial" font-size="12" fill="#085041">Node.js · Express.js</text>
</g>
<g>
  <rect x="84" y="336" width="160" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="164" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#04342C">Auth routes</text>
  <text x="164" y="378" text-anchor="middle" font-family="Arial" font-size="12" fill="#085041">Register, login, JWT</text>
</g>
<g>
  <rect x="260" y="336" width="160" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#04342C">Analysis routes</text>
  <text x="340" y="378" text-anchor="middle" font-family="Arial" font-size="12" fill="#085041">Upload, fetch, delete</text>
</g>
<g>
  <rect x="436" y="336" width="160" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="516" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#04342C">JWT middleware</text>
  <text x="516" y="378" text-anchor="middle" font-family="Arial" font-size="12" fill="#085041">Protects routes</text>
</g>

<g>
  <rect x="84" y="408" width="232" height="48" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="200" y="428" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#04342C">MongoDB</text>
  <text x="200" y="446" text-anchor="middle" font-family="Arial" font-size="12" fill="#085041">User and Analysis collections</text>
</g>
<line x1="200" y1="392" x2="200" y2="406" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="436" y1="364" x2="404" y2="364" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="340" y1="476" x2="340" y2="512" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="498" font-family="Arial" font-size="12" fill="#5F5E5A">multipart video</text>

<!-- AI service container -->
<g>
  <rect x="60" y="512" width="560" height="200" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="84" y="540" font-family="Arial" font-size="14" font-weight="700" fill="#4A1B0C">AI service</text>
  <text x="84" y="558" font-family="Arial" font-size="12" fill="#712B13">Python · FastAPI</text>
</g>
<g>
  <rect x="84" y="572" width="232" height="48" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="200" y="592" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#4A1B0C">/analyze endpoint</text>
  <text x="200" y="610" text-anchor="middle" font-family="Arial" font-size="12" fill="#712B13">Accepts video + mode</text>
</g>
<g>
  <rect x="364" y="572" width="232" height="48" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="592" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#4A1B0C">MediaPipe pose</text>
  <text x="480" y="610" text-anchor="middle" font-family="Arial" font-size="12" fill="#712B13">33 landmarks per frame</text>
</g>

<line x1="200" y1="620" x2="200" y2="636" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="620" x2="480" y2="636" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="84" y="636" width="232" height="56" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="200" y="660" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#4A1B0C">Batting / bowling analyzers</text>
  <text x="200" y="678" text-anchor="middle" font-family="Arial" font-size="12" fill="#712B13">Angles, weight transfer, CoM</text>
</g>
<g>
  <rect x="364" y="636" width="232" height="56" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="660" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#4A1B0C">OpenCV renderer</text>
  <text x="480" y="678" text-anchor="middle" font-family="Arial" font-size="12" fill="#712B13">Annotated video + CSV</text>
</g>

<line x1="316" y1="664" x2="362" y2="664" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
